name: Deploy backend to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: echo "Triggering Render deploy for velorix-backend..."

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY must be set in repository secrets.";
            exit 1;
          fi

          services=$(curl --fail-with-body -sS https://api.render.com/v1/services?limit=100 \
            -H "Authorization: Bearer ${RENDER_API_KEY}")
          service_id=$(echo "$services" | jq -r '.. | objects | select(.name? == "velorix-backend" and (.id? | strings | startswith("srv-"))) | .id' | head -n 1)
          if [ -z "$service_id" ] || [ "$service_id" = "null" ]; then
            service_id="$RENDER_SERVICE_ID"
          fi
          if [ -z "$service_id" ]; then
            echo "No Render service named velorix-backend was found.";
            exit 1;
          fi

          echo "Posting deploy request to Render service ${service_id}..."
          curl --fail-with-body -sS -X POST https://api.render.com/v1/services/${service_id}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
