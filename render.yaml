services:
  - type: web
    name: velorix-backend
    env: python
    plan: free
    repo: https://github.com/KevinWang526/velorix-signals
    branch: main
    buildCommand: ""
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ORDER_DOLLARS
        value: "1000"
