[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velorix"
version = "0.1.0"
description = "Personal quant trading toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "yfinance",
  "matplotlib",
  "pytest",
  "alpaca-trade-api",
  "python-dotenv",
  "streamlit",
  "pandas-datareader"
]
